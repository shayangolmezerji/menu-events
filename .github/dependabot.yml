version: 2
updates:
  # The CI actions are pinned to commit SHAs, which means nothing moves them on
  # its own. This is what turns the pins into a maintainable choice rather than
  # a slow rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Resolver only: there is no lockfile in this repository, so what these PRs
  # buy is early notice of a breaking upstream release. They are not meant to be
  # merged blind; the CI matrix on the other leg is what actually runs the code.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
