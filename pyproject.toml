[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "menu-events"
version = "0.1.0"
description = "Append-only menu event store with optimistic concurrency and replayable projections"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Shayan Golmezerji", email = "121007462+shayangolmezerji@users.noreply.github.com" },
]
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # ``fastapi.testclient`` is starlette's ``TestClient``, and starlette imports
    # an httpx at module level without declaring one: without this the tier has
    # no client to build. httpx over the httpx2 newer starlette prefers because
    # an older one, still resolvable under the fastapi floor above, knows only
    # httpx, and its ModuleNotFoundError reads to the tier's importorskip as a
    # missing extra, which skips 37 tests instead of failing them. 0.27 is the
    # floor starlette's own test-client extra names for this import path.
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/menu_events"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle whitespace
    "F",   # pyflakes
    "B",   # bugbear
    "UP",  # pyupgrade
    "I",   # isort
    "N",   # naming
    "SIM", # simplify
    "C4",  # comprehensions
    "PT",  # pytest style
    "RET", # early returns
    "T20", # no print
]
# N818 would rename every rejection to a suffixed form. These read as
# statements the caller matches on: ConcurrencyConflict, ItemNotOnMenu.
extend-ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT006", "PT007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "api: drives menu_events.api in process, skipped when the api extra is missing",
    "integration: talks to a real PostgreSQL server, skipped when none is reachable",
]

[tool.coverage.run]
source = ["menu_events"]
